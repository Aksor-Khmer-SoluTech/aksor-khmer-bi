# OPTIONAL override: build the app images from the Dockerfiles instead of pulling the prebuilt, version-pinned ones.
# Not needed to deploy -- docker-compose.yml alone pulls them. Use it for a fork, local changes, or an unreleased commit:
#   docker compose -p aksor-app -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait
# (./deployment.sh up --build / update --build do exactly this.) The build downloads Debian, Python and npm packages, so
# the machine needs internet (or APT_MIRROR / PIP_INDEX_URL / NPM_REGISTRY mirrors in .env), about 10 GB of disk and
# several minutes the first time. Images are tagged with AKSOR_VERSION as usual (deployment.sh uses `local` if unset).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        APT_SCHEME: ${APT_SCHEME:-http}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  jdbc-worker:
    build:
      context: .
      dockerfile: jdbc-worker/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        APT_SCHEME: ${APT_SCHEME:-http}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
