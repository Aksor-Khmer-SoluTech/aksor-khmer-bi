# The portal's server block (replaces nginx:alpine's conf.d/default.conf). It serves only the built static files;
# the browser talks to the API directly at PORTAL_API_BASE_URL, so nothing is proxied here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The image's nginx.conf leaves gzip off. The JavaScript and CSS shrink to about a third of their size.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/markdown application/javascript application/json image/svg+xml font/ttf;

    # Vite names every built file after its content hash, so a file under /assets/ never changes: a new release links
    # new names. The browser keeps them for a year and doesn't revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, config.js, fonts) keeps its name across releases and settings changes, so the
    # browser revalidates it every time: an upgraded image or a changed PORTAL_* value shows on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
