name: Release images

# Pushing a version tag (git tag v1.0.2 && git push origin v1.0.2) builds the images and publishes them to
# GitHub Container Registry as ghcr.io/<owner>/aksor-khmer-bi-{engine,portal,jdbc-worker}:<version>.
# Servers then deploy them with AKSOR_VERSION=<version> ./deployment.sh up -- no build, no Node.
# After the first publish, set each package to Public (GitHub -> Packages -> package settings) so pulls need no login.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # A tag never publishes images for a commit whose tests fail: the whole CI workflow runs first.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine, file: Dockerfile }
          - { name: portal, file: portal/Dockerfile }
          - { name: jdbc-worker, file: jdbc-worker/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name and version
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"            # registry names must be lowercase
          echo "image=ghcr.io/${owner}/aksor-khmer-bi-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v1.0.2 -> 1.0.2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the repo root, like docker-compose.yml: the portal bundles /docs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          # Build provenance and a software bill of materials, attached to each image in the registry.
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
