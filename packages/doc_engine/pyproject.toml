[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-engine"
version = "0.1.0"
description = "Format-routed document rendering (docx/pdf/png/xlsx) with a LibreOffice engine and a WeasyPrint engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "docxtpl>=0.20",
    "jinja2>=3.1",
    "weasyprint>=69.0",
    "openpyxl>=3.1",
    "xltpl>=0.21",
    "matplotlib>=3.8",
    "aksor-khmer-ocr-segmenter>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
