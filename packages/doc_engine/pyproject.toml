[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-engine"
version = "0.1.0"
description = "Format-routed document rendering (docx/pdf/png/xlsx) with a LibreOffice engine and a WeasyPrint engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "docxtpl>=0.20",
    "jinja2>=3.1",
    "weasyprint>=69.0",
    "openpyxl>=3.1",
    "xltpl>=0.21",
    "matplotlib>=3.8",
    "fonttools>=4.40",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    "Pillow>=10",
    "aksor-khmer-ocr-segmenter>=0.1.0",
]

[project.optional-dependencies]
# zxing-cpp reads QR codes and barcodes back out of rendered output, so the tests prove a code scans.
dev = ["pytest>=8.0", "zxing-cpp>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
